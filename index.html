<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0e17">
<title>Beeflix</title>
<style>
:root{--bg:#0b0e17;--card:#141926;--card2:#1b2233;--txt:#f2f5fa;--mut:#8e98ad;--acc:#2ee6a0;--acc2:#12c98a;--warn:#ffd36a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{padding-bottom:84px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(#0b0e17 70%,rgba(11,14,23,0));padding:10px 14px 4px}
.bar{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;flex:none}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:0 12px;height:42px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font-size:15px}
.search b{color:var(--acc);font-weight:600;font-size:15px}
.up{width:40px;height:40px;border-radius:50%;background:#ff4560;display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:22px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.row::-webkit-scrollbar,.pills::-webkit-scrollbar,.chips::-webkit-scrollbar,.cats::-webkit-scrollbar{display:none}
.tabs button{font-size:18px;color:var(--mut);white-space:nowrap;padding-bottom:4px;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;font-weight:700;border-color:var(--acc)}
.hero{position:relative;margin:6px 0 0;height:56vw;max-height:340px;min-height:220px;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;background-size:cover;background-position:center;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,rgba(11,14,23,.25) 60%,rgba(11,14,23,.55))}
.slide>*{position:relative}
.slide h2{margin:0 0 4px;font-size:26px;line-height:1.1;text-shadow:0 2px 10px #000}
.meta{color:#cfd6e4;font-size:13px;margin-bottom:10px}
.btns{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;background:var(--acc);color:#04261a;font-weight:700;font-size:14px}
.btn.g{background:rgba(255,255,255,.14);color:#fff}
.dots{position:absolute;right:14px;bottom:14px;display:flex;gap:5px;z-index:2}
.dots i{width:6px;height:6px;border-radius:3px;background:#ffffff55}
.dots i.on{width:16px;background:var(--acc)}
.chips{display:flex;gap:12px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.chip{flex:none;width:78%;max-width:340px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:8px;position:relative}
.chip .pm{width:48px;height:64px;border-radius:8px;flex:none;background-size:cover;background-position:center}
.chip .t{flex:1;min-width:0}
.chip .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.chip .t span{color:var(--mut);font-size:13px}
.dl{width:38px;height:38px;border-radius:50%;background:var(--acc2);display:grid;place-items:center;flex:none;color:#04261a}
.promo{margin:14px;border-radius:var(--r);padding:16px;background:linear-gradient(120deg,#6a4b1d,#d9a64e 55%,#8a6428);display:flex;align-items:center;gap:12px;justify-content:space-between}
.promo h4{margin:0 0 4px;font-size:17px;color:#2a1b04}
.promo p{margin:0;color:#4a3410;font-size:13px}
.promo button{background:#ffe8a8;color:#4a3410;font-weight:700;padding:10px 16px;border-radius:999px}
.sec{margin-top:18px}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 14px}
.sh h3{margin:0;font-size:20px}
.sh button{color:var(--mut);font-size:14px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.pill{flex:none;padding:8px 16px;border-radius:999px;color:var(--mut);font-size:15px}
.pill.on{background:var(--card2);color:#fff;font-weight:700}
.row{display:flex;gap:10px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
.card{flex:none;width:30vw;max-width:150px;min-width:104px;text-align:left}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card2) center/cover}
.poster .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:8px;font-weight:800;font-size:15px;line-height:1.1;text-shadow:0 2px 8px #0009}
.vf{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 6px;border-radius:5px}
.crown{position:absolute;top:0;left:0;background:var(--warn);color:#4a3410;font-size:11px;font-weight:800;padding:3px 6px;border-bottom-right-radius:8px}
.rank{position:absolute;right:4px;bottom:-6px;font-size:54px;font-weight:900;color:#ffffff33;line-height:1}
.card .nm{margin:6px 2px 0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cats{display:flex;gap:10px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
.cat{flex:none;width:150px;height:62px;border-radius:12px;display:flex;align-items:center;padding:0 16px;font-size:18px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;padding:12px 14px}
.grid .card{width:auto;max-width:none}
.page{display:none}.page.on{display:block}
.empty{padding:40px 24px;text-align:center;color:var(--mut)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:#10141f;border-top:1px solid #ffffff10;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mut);padding:4px 0}
.nav button.on{color:#fff}
.nav button.on svg{color:var(--acc)}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .28s;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .cover{height:52vw;max-height:320px;background:var(--card2) center/cover;position:relative}
.sheet .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg),transparent 70%)}
.back{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;z-index:3;width:40px;height:40px;border-radius:50%;background:#000a;display:grid;place-items:center}
.sbody{padding:0 16px 40px;margin-top:-30px;position:relative;z-index:2}
.sbody h1{margin:0 0 6px;font-size:26px}
.sbody p{color:#c5ccda;line-height:1.5;font-size:15px}
.act{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
/* Écran de visionnage : lecteur en haut, panneau Ressources dessous */
.player{position:fixed;inset:0;z-index:80;background:#0b0e17;display:none;flex-direction:column}
.player.on{display:flex}
.stage{position:relative;background:#000;flex:none;padding-top:env(safe-area-inset-top)}
.stage video{display:block;width:100%;aspect-ratio:16/9;max-height:56vh;background:#000}
.ptop{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;align-items:center;gap:10px;padding:8px 10px 26px;background:linear-gradient(#000b,transparent);z-index:2;pointer-events:none}
.ptop>*{pointer-events:auto}
.ptop .back{position:static;flex:none}
.ptop span{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px #000}
.perr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:#cfd6e4;background:#000c;z-index:1;line-height:1.5}
.res{flex:1;min-height:0;display:flex;flex-direction:column;background:#10141f}
.resh{display:flex;justify-content:space-between;align-items:center;padding:20px 16px 18px;border-bottom:1px solid #ffffff14}
.resh h3{margin:0;font-size:24px}
.resh button{width:40px;height:40px;display:grid;place-items:center;color:#aab3c5}
.resg{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px;align-content:start}
.ep{background:#23262e;border-radius:10px;padding:12px 14px;text-align:left;min-width:0}
.ep b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep span{color:var(--mut);font-size:14px}
.ep.on{background:linear-gradient(120deg,#0e4c5a,#0f3b34);box-shadow:inset 0 0 0 1px #2ee6a044}
.ep.on b,.ep.on span{color:var(--acc)}
.player.nores .stage{flex:1;display:flex;align-items:center}
.player.nores .stage video{max-height:100%;height:100%;aspect-ratio:auto}
.player.nores .res{display:none}
.sbody .resg{padding:0;overflow:visible;margin-top:6px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#222a3c;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%)}
.li{display:flex;gap:12px;padding:10px 14px;align-items:center}
.li .poster{width:64px;flex:none}
.li .info{flex:1;min-width:0}
.li .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .info span{color:var(--mut);font-size:13px}
.me{padding:20px 14px}
.me .av{width:64px;height:64px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:28px}
.box{background:var(--card);border-radius:var(--r);padding:14px;margin-top:14px;font-size:14px;color:#c5ccda;line-height:1.5}
.box b{color:#fff}
.ok{color:var(--acc)}.ko{color:var(--warn)}
</style>
</head>
<body>

<header class="top">
  <div class="bar">
    <svg class="logo" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#12c98a"/><ellipse cx="24" cy="26" rx="12" ry="10" fill="#0b0e17"/><path d="M12 22h24M12 27h24M13 32h22" stroke="#2ee6a0" stroke-width="3"/><path d="M21 12l-4 6M27 12l4 6" stroke="#0b0e17" stroke-width="3" stroke-linecap="round"/><path d="M21 21l9 5-9 5z" fill="#fff"/></svg>
    <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8e98ad" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Rechercher un titre…" autocomplete="off"><b>Recherche</b></label>
    <button class="up" id="btnInfo" aria-label="Connexion"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 19V6M6 11l6-6 6 6"/></svg></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <section class="page on" id="p-home">
    <div class="hero" id="hero"></div>
    <div class="chips" id="chips"></div>
    <div class="promo"><div><h4>Débloquez les avantages Premium</h4><p>Sans pub · HD · Contenus Premium</p></div><button onclick="toast('Bientôt disponible')">Déverrouiller</button></div>
    <div id="rows"></div>
    <div class="sec"><div class="sh"><h3>Catégories</h3></div><div class="cats" id="cats"></div></div>
  </section>
  <section class="page" id="p-list"><div class="sh" style="padding-top:12px"><h3 id="lt"></h3></div><div class="grid" id="lg"></div></section>
  <section class="page" id="p-fav"><div class="sh" style="padding-top:12px"><h3>Favoris</h3></div><div class="grid" id="fg"></div></section>
  <section class="page" id="p-dl"><div class="sh" style="padding-top:12px"><h3>Téléchargements</h3></div><div id="dg"></div></section>
  <section class="page" id="p-me"><div class="me">
    <div style="display:flex;gap:14px;align-items:center"><div class="av">🐝</div><div><b style="font-size:20px">Invité</b><div style="color:var(--mut);font-size:14px">Beeflix</div></div></div>
    <div class="box" id="conn"></div>
    <div class="sh" style="padding:18px 0 0"><h3>Reprendre</h3></div><div id="cont"></div>
  </div></section>
</main>

<nav class="nav" id="nav">
  <button data-p="home" class="on"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Accueil</button>
  <button data-p="search"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Recherche</button>
  <button data-p="fav"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.7-8 11-8 11z"/></svg>Favoris</button>
  <button data-p="dl"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 7v8M8 12l4 4 4-4"/></svg>Téléchargements</button>
  <button data-p="me"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>Moi</button>
</nav>

<div class="sheet" id="detail"></div>

<div class="player" id="player">
  <div class="stage">
    <video id="vid" controls playsinline></video>
    <div class="ptop">
      <button class="back" id="pclose" aria-label="Fermer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="ptitle"></span>
      <button class="back" id="pdl" aria-label="Télécharger"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button>
      <button class="back" id="pres" aria-label="Ressources"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
    <div class="perr" id="perr"></div>
  </div>
  <div class="res" id="res">
    <div class="resh"><h3>Ressources</h3><button id="resx" aria-label="Fermer le panneau"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="resg" id="resg"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG : à remplir pour brancher Telegram ============ */
const CONFIG = {
  // Supabase = catalogue (tables bf_videos + bf_episodes, voir schema.sql)
  SUPABASE_URL: "https://auzbestspfwjtityfucm.supabase.co",
  SUPABASE_KEY: "sb_publishable_e76S6aXK2Jx_nULSX9Ssxg_7qyB9TxM",
  // Relais Telegram (dossier relay/) : adresse publique du service déployé
  //   GET {RELAY_URL}/stream/{id_episode}    → flux vidéo (Range supporté)
  //   GET {RELAY_URL}/download/{id_episode}  → téléchargement
  RELAY_URL: ""
};

/* ============ Données de démonstration (si le catalogue est vide) ============ */
const DEMO=(()=>{
  const base=[
   ["Nuit d'étoiles","anime",2026,"Aventure"],["Le Dernier Samouraï du Sahel","anime",2025,"Action"],["Académie des Esprits","anime",2026,"Fantastique"],["Lames d'Argent","anime",2024,"Action"],
   ["Les Ombres de l'Aïr","film",2026,"Thriller"],["Désert Rouge","film",2026,"Action"],["Le Dernier Convoi","film",2025,"Drame"],["Éclats de Rire","film",2025,"Comédie"],
   ["Les Gardiens du Fleuve","serie",2026,"Drame"],["Code Sahel","serie",2026,"Policier"],["Famille Moderne VF","serie",2025,"Comédie"],["Horizon Noir","serie",2024,"Science-fiction"]];
  return base.map((d,i)=>{
    const id="demo"+i,it={id,title:d[0],type:d[1],year:d[2],genre:d[3],lang:"VF",desc:"Contenu de démonstration. Poste tes vidéos dans ton groupe Telegram : elles apparaîtront ici automatiquement.",poster_url:"",backdrop_url:"",premium:i%5===0,demo:true,eps:[]};
    if(d[1]==="film")it.eps=[{id:id+"e",season:null,episode:null,label:"Film complet",size_bytes:(900+i*37)*1e6}];
    else for(let s=1;s<=(i%2?2:1);s++)for(let e=1;e<=12;e++)it.eps.push({id:`${id}s${s}e${e}`,season:s,episode:e,size_bytes:(50+((i*7+s*3+e*5)%16)+((e*13)%10)/10)*1e6});
    return it;
  });
})();

/* ============ État ============ */
const S={items:[],tab:"Tendance",page:"home",live:false};
const $=s=>document.querySelector(s);
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs=LS.get("bf_favs",[]),dls=LS.get("bf_dls",[]),prog=LS.get("bf_prog",{});
const TYPES={anime:"Animés",film:"Films",serie:"Séries"};
const TABS=[["Tendance",null],["Anime","anime"],["Film","film"],["Séries","serie"]];
const GRAD=["#1f6f8b,#0b2a3a","#7b2d8e,#241033","#c2410c,#33140a","#0f766e,#08241f","#be123c,#2a0a14","#4338ca,#14123a"];

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
function grad(it){let h=0;for(const c of it.title)h=(h*31+c.charCodeAt(0))>>>0;return GRAD[h%GRAD.length]}
function bg(it,key){const u=(key&&it[key])||it.poster_url;return u?`style="background-image:url('${esc(u)}')"`:`style="background-image:linear-gradient(160deg,${grad(it)})"`}
const byId=id=>S.items.find(i=>String(i.id)===String(id));
const pad=n=>String(n).padStart(2,"0");
function epLabel(e){return e.season!=null&&e.episode!=null?`S${pad(e.season)} E${pad(e.episode)}`:(e.label||"Film complet")}
function fmtSize(b){if(!b)return"";const mb=b/1e6;return mb>=1000?(mb/1000).toFixed(2)+"GB":mb.toFixed(1)+"MB"}
function fmt(s){s=Math.floor(s||0);const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0")}

/* ============ Couche données (Supabase ↔ Telegram) ============ */
const relay=()=>CONFIG.RELAY_URL.replace(/\/$/,"");
function streamUrl(ep){return ep.stream_url||(CONFIG.RELAY_URL?`${relay()}/stream/${encodeURIComponent(ep.id)}`:"")}
function downloadUrl(ep){return CONFIG.RELAY_URL?`${relay()}/download/${encodeURIComponent(ep.id)}`:(ep.stream_url||"")}
async function fetchAll(table,order){
  const h={apikey:CONFIG.SUPABASE_KEY,Authorization:"Bearer "+CONFIG.SUPABASE_KEY};
  let out=[],from=0;
  for(;;){
    const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?select=*&order=${order}`,{headers:{...h,"Range-Unit":"items",Range:`${from}-${from+999}`}});
    if(!r.ok)throw new Error(table+" "+r.status);
    const rows=await r.json();out=out.concat(rows);
    if(rows.length<1000)break;from+=1000;
  }
  return out;
}
async function load(){
  try{
    const [v,e]=await Promise.all([fetchAll("bf_videos","created_at.desc"),fetchAll("bf_episodes","created_at.asc")]);
    if(v.length){
      const map=new Map(v.map(x=>[x.id,{...x,eps:[]}]));
      for(const ep of e){const it=map.get(ep.video_id);if(it)it.eps.push(ep)}
      for(const it of map.values())it.eps.sort((a,b)=>(a.season??0)-(b.season??0)||(a.episode??0)-(b.episode??0));
      S.items=[...map.values()];S.live=true;LS.set("bf_cache",S.items);
    }else S.items=DEMO;
  }catch(err){
    const c=LS.get("bf_cache",[]);S.items=c.length?c:DEMO;S.live=c.length>0;
  }
  render();
}

/* ============ Rendu ============ */
function card(it,rank){
  return `<button class="card" data-id="${esc(it.id)}"><div class="poster" ${bg(it)}>${it.poster_url?"":`<div class="ph">${esc(it.title)}</div>`}${it.premium?'<span class="crown">★</span>':""}<span class="vf">${esc(it.lang||"VF")}</span>${rank?`<span class="rank">${rank}</span>`:""}</div><div class="nm">${esc(it.title)}</div></button>`;
}
function renderTabs(){$("#tabs").innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-t="${t[0]}">${t[0]}</button>`).join("")}
function filtered(){const t=TABS.find(x=>x[0]===S.tab)[1];return t?S.items.filter(i=>i.type===t):S.items}
function renderHome(){
  const list=filtered(),hero=list.slice(0,5);
  $("#hero").innerHTML=hero.map((it,i)=>`<div class="slide ${i?"":"on"}" ${bg(it,"backdrop_url")}><h2>${esc(it.title)}</h2><div class="meta">${esc(it.year||"")} · ${esc(it.genre||"")} · ${esc(it.lang||"VF")}</div><div class="btns"><button class="btn" data-play="${esc(it.id)}">▶ Regarder</button><button class="btn g" data-id="${esc(it.id)}">Détails</button></div></div>`).join("")+`<div class="dots">${hero.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`;
  $("#chips").innerHTML=list.slice(0,6).map(it=>`<div class="chip" data-id="${esc(it.id)}"><div class="pm" ${bg(it)}></div><div class="t"><b>${esc(it.title)}</b><span>${esc(it.year||"")} | ${esc(it.genre||"")}</span></div><button class="dl" data-dl="${esc(it.id)}" aria-label="Télécharger"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button></div>`).join("");
  const keys=S.tab==="Tendance"?["serie","anime","film"]:[TABS.find(x=>x[0]===S.tab)[1]];
  $("#rows").innerHTML=keys.map(k=>{
    const arr=S.items.filter(i=>i.type===k);if(!arr.length)return"";
    const genres=["Tous",...new Set(arr.map(i=>i.genre).filter(Boolean))];
    return `<div class="sec" data-k="${k}"><div class="sh"><h3>${TYPES[k]} Tendance</h3><button data-all="${k}">Tous ›</button></div><div class="pills">${genres.map((g,i)=>`<button class="pill ${i?"":"on"}" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div><div class="row">${arr.slice(0,12).map((it,i)=>card(it,i<3?i+1:0)).join("")}</div></div>`;
  }).join("");
  const cats=["Tous",...new Set(S.items.map(i=>i.genre).filter(Boolean))];
  $("#cats").innerHTML=cats.map((c,i)=>`<button class="cat" data-cat="${esc(c)}" style="background:linear-gradient(120deg,${GRAD[i%GRAD.length]})">${esc(c)}</button>`).join("");
  startHero();
}
let heroT;
function startHero(){
  clearInterval(heroT);const sl=[...document.querySelectorAll(".slide")];if(sl.length<2)return;let i=0;
  heroT=setInterval(()=>{sl[i].classList.remove("on");i=(i+1)%sl.length;sl[i].classList.add("on");document.querySelectorAll(".dots i").forEach((d,j)=>d.classList.toggle("on",j===i))},4500);
}
function listHTML(arr){return arr.length?arr.map(it=>card(it)).join(""):`<div class="empty" style="grid-column:1/-1">Rien à afficher pour l'instant.</div>`}
function renderFav(){$("#fg").innerHTML=listHTML(S.items.filter(i=>favs.includes(i.id)))}
function findEp(epId){for(const it of S.items){const ep=it.eps.find(e=>String(e.id)===String(epId));if(ep)return{it,ep}}return null}
function renderDl(){
  const arr=dls.map(findEp).filter(Boolean);
  $("#dg").innerHTML=arr.length?arr.map(({it,ep})=>`<div class="li"><div class="poster" ${bg(it)} data-id="${esc(it.id)}"></div><div class="info"><b>${esc(it.title)}</b><span>${esc(epLabel(ep))} · ${esc(fmtSize(ep.size_bytes))}</span></div><button class="dl" data-ep="${esc(ep.id)}" data-vid="${esc(it.id)}" aria-label="Lire">▶</button></div>`).join(""):`<div class="empty">Aucun téléchargement.<br>Appuie sur la flèche d'un titre pour l'ajouter.</div>`;
}
function renderMe(){
  const rel=!!CONFIG.RELAY_URL;
  $("#conn").innerHTML=`<b>Connexions</b><br>Catalogue Supabase : <span class="${S.live?"ok":"ko"}">${S.live?"connecté":"démo (aucune vidéo ajoutée)"}</span><br>Relais Telegram : <span class="${rel?"ok":"ko"}">${rel?"configuré":"à configurer (RELAY_URL)"}</span>`;
  const last=new Map();
  for(const id of Object.keys(prog)){const f=findEp(id);if(!f)continue;const o=last.get(f.it.id);if(!o||prog[id].at>prog[o.ep.id].at)last.set(f.it.id,f)}
  const arr=[...last.values()].sort((a,b)=>prog[b.ep.id].at-prog[a.ep.id].at);
  $("#cont").innerHTML=arr.length?arr.map(({it,ep})=>{const p=prog[ep.id];return `<div class="li" style="padding-left:0" data-ep="${esc(ep.id)}" data-vid="${esc(it.id)}"><div class="poster" ${bg(it)}></div><div class="info"><b>${esc(it.title)}</b><span>${esc(epLabel(ep))} · ${fmt(p.t)} / ${fmt(p.d)}</span></div></div>`}).join(""):`<div class="empty" style="padding:20px 0">Rien en cours.</div>`;
}
function render(){renderTabs();renderHome();renderFav();renderDl();renderMe()}

/* ============ Navigation ============ */
function go(p){
  S.page=p;
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p||(p==="list"&&b.dataset.p==="home")));
  if(p==="search"){$("#p-list").classList.add("on");$("#lt").textContent="Recherche";$("#q").focus();doSearch()}
  else $("#p-"+p).classList.add("on");
  if(p==="fav")renderFav();if(p==="dl")renderDl();if(p==="me")renderMe();
  scrollTo(0,0);
}
function showList(title,arr){$("#lt").textContent=title;$("#lg").innerHTML=listHTML(arr);go("list")}
function doSearch(){
  const v=$("#q").value.trim().toLowerCase();
  if(!v){if(S.page==="search")$("#lg").innerHTML=listHTML(S.items);return}
  if(S.page!=="search"&&S.page!=="list")go("search");
  $("#lt").textContent="Recherche";
  $("#lg").innerHTML=listHTML(S.items.filter(i=>(i.title+" "+(i.genre||"")+" "+(i.type||"")).toLowerCase().includes(v)));
}
$("#q").addEventListener("input",doSearch);
$("#q").addEventListener("focus",()=>{if(S.page!=="search"&&S.page!=="list")go("search")});

/* ============ Détail ============ */
function epGrid(it,activeId){
  return it.eps.map(e=>`<button class="ep ${String(e.id)===String(activeId)?"on":""}" data-ep="${esc(e.id)}" data-vid="${esc(it.id)}"><b>${esc(epLabel(e))}</b><span>${esc(fmtSize(e.size_bytes))||"&nbsp;"}</span></button>`).join("");
}
function openDetail(id){
  const it=byId(id);if(!it)return;
  const fav=favs.includes(it.id);
  $("#detail").innerHTML=`<div class="cover" ${bg(it,"backdrop_url")}><button class="back" data-close><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button></div>
  <div class="sbody"><h1>${esc(it.title)}</h1><div class="meta">${esc(it.year||"")} · ${esc(it.genre||"")} · ${esc(it.lang||"VF")} · ${esc(TYPES[it.type]||"")}</div>
  <div class="act"><button class="btn" data-play="${esc(it.id)}">▶ Regarder</button><button class="btn g" data-fav="${esc(it.id)}">${fav?"♥ Retirer":"♡ Favori"}</button><button class="btn g" data-dl="${esc(it.id)}">⬇ Télécharger</button></div>
  <p>${esc(it.desc||"Aucune description.")}</p>
  ${it.eps.length?`<div class="sh" style="padding:6px 0"><h3>Ressources</h3></div><div class="resg">${epGrid(it)}</div>`:`<div class="empty">Aucune vidéo disponible pour l'instant.</div>`}</div>`;
  $("#detail").classList.add("on");$("#detail").scrollTop=0;
}
function closeDetail(){$("#detail").classList.remove("on")}

/* ============ Lecteur ============ */
let cur=null,lastSave=0;
function pickEp(it){
  let best=null;
  for(const e of it.eps){const p=prog[e.id];if(p&&(!best||p.at>prog[best.id].at))best=e}
  return best||it.eps[0]||null;
}
function renderRes(){
  if(!cur)return;
  $("#resg").innerHTML=epGrid(cur.it,cur.ep.id);
  const on=$("#resg .ep.on");if(on)on.scrollIntoView({block:"nearest"});
}
function play(id,epId){
  const it=byId(id);if(!it)return;
  const ep=epId?it.eps.find(e=>String(e.id)===String(epId)):pickEp(it);
  if(!ep){toast("Aucune vidéo pour ce titre pour l'instant");return}
  cur={it,ep};
  const v=$("#vid"),err=$("#perr");
  $("#ptitle").textContent=ep.season!=null?`${it.title} · ${epLabel(ep)}`:it.title;
  err.style.display="none";
  $("#player").classList.add("on");
  renderRes();
  const u=streamUrl(ep);
  if(!u){
    v.removeAttribute("src");v.load();err.style.display="flex";
    err.innerHTML=it.demo?"Titre de démonstration.<br>Poste une vidéo dans ton groupe Telegram pour la lire ici.":"Relais Telegram non configuré.<br>Renseigne RELAY_URL dans index.html.";
    return;
  }
  const p=prog[ep.id];
  v.src=u;v.load();
  v.onloadedmetadata=()=>{if(p&&p.t>5&&p.t<v.duration-10)v.currentTime=p.t;v.play().catch(()=>{})};
  v.onerror=()=>{err.style.display="flex";err.innerHTML="Lecture impossible.<br>Vérifie que le relais Telegram est en ligne."};
}
function closePlayer(){const v=$("#vid");v.pause();v.removeAttribute("src");v.load();$("#player").classList.remove("on","nores");cur=null}
$("#vid").addEventListener("timeupdate",()=>{
  const v=$("#vid");if(!cur||!v.duration)return;
  const now=Date.now();if(now-lastSave<5000)return;lastSave=now;
  prog[cur.ep.id]={t:v.currentTime,d:v.duration,at:now};LS.set("bf_prog",prog);
});
$("#vid").addEventListener("ended",()=>{
  if(!cur)return;
  delete prog[cur.ep.id];LS.set("bf_prog",prog);
  const i=cur.it.eps.findIndex(e=>e.id===cur.ep.id),n=cur.it.eps[i+1];
  if(n){toast("Épisode suivant");play(cur.it.id,n.id)}else toast("Fin");
});
$("#pclose").onclick=closePlayer;
$("#pres").onclick=()=>$("#player").classList.toggle("nores");
$("#resx").onclick=()=>$("#player").classList.add("nores");
$("#pdl").onclick=()=>{if(cur)downloadEp(cur.ep,cur.it)};

/* ============ Actions ============ */
function toggleFav(id){
  const i=favs.indexOf(id);if(i>=0)favs.splice(i,1);else favs.push(id);
  LS.set("bf_favs",favs);toast(i>=0?"Retiré des favoris":"Ajouté aux favoris");renderFav()
}
function downloadEp(ep,it){
  const u=downloadUrl(ep);
  if(!u){toast(it.demo?"Titre de démonstration":"Relais Telegram non configuré");return}
  const a=document.createElement("a");a.href=u;a.download=`${it.title} ${epLabel(ep)}.mp4`;document.body.appendChild(a);a.click();a.remove();
  if(!dls.includes(ep.id)){dls.push(ep.id);LS.set("bf_dls",dls)}
  toast("Téléchargement lancé");renderDl()
}
function download(id){
  const it=byId(id);if(!it)return;
  const ep=pickEp(it);if(!ep){toast("Aucune vidéo pour ce titre pour l'instant");return}
  downloadEp(ep,it);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-ep],[data-play],[data-dl],[data-fav],[data-all],[data-g],[data-cat],[data-close],[data-id],[data-t],#nav button,#btnInfo");
  if(!t)return;
  const d=t.dataset;
  if(t.id==="btnInfo"){go("me");return}
  if(t.closest("#nav")){closeDetail();go(d.p);return}
  if(d.close!==undefined){closeDetail();return}
  if(d.ep){play(d.vid,d.ep);return}
  if(d.play){play(d.play);return}
  if(d.dl){download(d.dl);return}
  if(d.fav){toggleFav(d.fav);openDetail(d.fav);return}
  if(d.t){S.tab=d.t;renderTabs();renderHome();go("home");return}
  if(d.all){showList(TYPES[d.all],S.items.filter(i=>i.type===d.all));return}
  if(d.cat){showList(d.cat,d.cat==="Tous"?S.items:S.items.filter(i=>i.genre===d.cat));return}
  if(d.g!==undefined){
    const sec=t.closest(".sec"),k=sec.dataset.k;
    sec.querySelectorAll(".pill").forEach(p=>p.classList.toggle("on",p===t));
    const arr=S.items.filter(i=>i.type===k&&(d.g==="Tous"||i.genre===d.g));
    sec.querySelector(".row").innerHTML=arr.slice(0,12).map(it=>card(it)).join("");return
  }
  if(d.id){openDetail(d.id)}
});

load();
</script>
</body>
</html>
